<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hồ sơ — XeDaNang</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5.7.47/daisyui.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body class="bg-base-100 text-base-content">

  <div class="navbar bg-base-100 shadow-sm px-6 sticky top-0 z-40">
    <div class="flex-1">
      <a href="index.html" class="text-xl font-bold text-primary">🚗 XeDaNang</a>
    </div>
    <div class="hidden md:flex gap-2 items-center">
      <a href="index.html" class="btn btn-ghost btn-sm">Tìm xe</a>
      <a href="owner-listing.html" class="btn btn-ghost btn-sm">Đăng xe của bạn</a>
      <a href="owner-bookings.html" class="btn btn-ghost btn-sm">Quản lý booking</a>
      <a href="profile.html?id=1" class="btn btn-ghost btn-sm btn-active">Hồ sơ</a>
      <button class="btn btn-primary btn-sm" onclick="openLoginModal()">Đăng nhập</button>
    </div>
  </div>

  <div class="px-6 py-8 max-w-4xl mx-auto">
    <div id="profile-header" class="flex items-center gap-4 mb-8"></div>
    <div role="tablist" class="tabs tabs-boxed mb-6 w-fit" id="tabs"></div>
    <div id="tab-content"></div>
  </div>

  <footer class="bg-base-200 py-10 px-6 mt-10">
    <div class="max-w-6xl mx-auto text-center text-sm text-base-content/50">
      🚗 XeDaNang — nền tảng trung gian kết nối người thuê &amp; chủ xe tại Đà Nẵng.
    </div>
  </footer>

  <script src="shared.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const userId = Number(params.get("id")) || 1;
    const user = getUserById(userId);
    const rating = computeRating(userId);
    let activeTab = "cars";

    document.getElementById("profile-header").innerHTML = `
      <div class="avatar placeholder">
        <div class="bg-primary text-primary-content w-16 rounded-full">
          <span class="text-xl">${user.name.charAt(0)}</span>
        </div>
      </div>
      <div>
        <h1 class="text-xl font-bold">${user.name}</h1>
        <p class="text-warning font-medium">${starLabel(rating.avg, rating.count)} · Tham gia ${user.joinedYear}</p>
        <p class="text-sm text-base-content/60">${user.verified ? "📞 Đã xác thực SĐT ✅" : "📞 Chưa xác thực SĐT"}</p>
      </div>
    `;

    function renderTabs() {
      document.getElementById("tabs").innerHTML = `
        <a role="tab" class="tab ${activeTab === 'cars' ? 'tab-active' : ''}" onclick="setTab('cars')">Xe đang cho thuê</a>
        <a role="tab" class="tab ${activeTab === 'reviews' ? 'tab-active' : ''}" onclick="setTab('reviews')">Đánh giá nhận được</a>
      `;
    }
    function setTab(k) { activeTab = k; renderTabs(); renderContent(); }

    function renderContent() {
      const el = document.getElementById("tab-content");
      if (activeTab === "cars") {
        const cars = getCars().filter(c => c.ownerId === userId && c.status === "active");
        el.innerHTML = cars.length ? `<div class="grid md:grid-cols-2 gap-4">${cars.map(car => `
          <a href="detail.html?id=${car.id}" class="card bg-base-100 border border-base-200 hover:shadow-md transition">
            <div class="card-body p-4 flex-row items-center gap-4">
              <div class="h-14 w-14 bg-base-200 rounded-box flex items-center justify-center text-2xl">🚙</div>
              <div>
                <p class="font-semibold">${car.title}</p>
                <p class="text-xs text-base-content/60">${car.district} · ${formatVND(car.pricePerDay)}/ngày</p>
              </div>
            </div>
          </a>
        `).join("")}</div>` : '<p class="text-sm text-base-content/50">Chưa có xe nào đang cho thuê.</p>';
      } else {
        const reviews = getReviews().filter(r => r.revieweeId === userId);
        el.innerHTML = reviews.length ? `<div class="space-y-3">${reviews.map(r => `
          <div class="card bg-base-100 border border-base-200">
            <div class="card-body p-4">
              <p class="text-warning text-sm font-medium">${"★".repeat(r.rating)}${"☆".repeat(5-r.rating)}</p>
              <p class="text-sm">${r.comment}</p>
              <p class="text-xs text-base-content/50 mt-1">— ${r.authorName}</p>
            </div>
          </div>
        `).join("")}</div>` : '<p class="text-sm text-base-content/50">Chưa có đánh giá nào.</p>';
      }
    }

    renderTabs();
    renderContent();
  </script>
</body>
</html>
