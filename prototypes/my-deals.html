<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deal của tôi — BrokerConnect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet" type="text/css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body class="bg-base-100 text-base-content">

  <div class="drawer lg:drawer-open">
    <input id="app-drawer" type="checkbox" class="drawer-toggle" />
    <div class="drawer-content flex flex-col min-h-screen">

      <div class="navbar bg-base-100 border-b border-base-200 px-4 lg:px-6 gap-2">
        <div class="flex-none lg:hidden">
          <label for="app-drawer" class="btn btn-square btn-ghost btn-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7" /></svg>
          </label>
        </div>
        <div class="flex-1"><span class="font-semibold">Deal của tôi</span></div>
        <div class="flex items-center gap-2">
          <a href="create-listing.html" class="btn btn-primary btn-sm hidden sm:inline-flex">+ Đăng tin</a>
        </div>
      </div>

      <main class="flex-1 p-4 lg:p-6 bg-base-200/30">
        <div role="tablist" class="tabs tabs-boxed mb-4 w-fit" id="status-tabs">
          <a role="tab" class="tab tab-active" data-status="">Tất cả</a>
          <a role="tab" class="tab" data-status="pending">Chờ duyệt</a>
          <a role="tab" class="tab" data-status="accepted">Đang xử lý</a>
          <a role="tab" class="tab" data-status="closed_won">Hoàn tất</a>
          <a role="tab" class="tab" data-status="disputed">Tranh chấp</a>
        </div>

        <div id="deal-list" class="grid md:grid-cols-2 gap-4"></div>
        <div id="empty-state" class="hidden flex-col items-center justify-center py-16 px-6 text-center">
          <div class="text-6xl mb-4">📭</div>
          <h3 class="text-lg font-semibold mb-2">Không có deal nào ở mục này</h3>
        </div>
      </main>
    </div>

    <div class="drawer-side z-20">
      <label for="app-drawer" class="drawer-overlay"></label>
      <aside class="w-64 min-h-screen bg-base-100 border-r border-base-200 p-4 flex flex-col">
        <a href="feed.html" class="text-xl font-bold px-2 mb-8 text-primary">🤝 BrokerConnect</a>
        <ul class="menu flex-1 gap-1">
          <li><a href="feed.html">📋 Bảng tin</a></li>
          <li><a href="my-deals.html" class="active">🤝 Deal của tôi</a></li>
          <li><a href="profile.html">👤 Hồ sơ</a></li>
        </ul>
        <div class="divider text-xs">Nhóm của tôi</div>
        <ul class="menu" id="my-groups-menu"></ul>
        <div class="mt-auto pt-4">
          <a href="#" id="reset-demo-data" class="text-xs text-base-content/40 hover:text-base-content/70">↺ Reset dữ liệu demo</a>
        </div>
      </aside>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script>
    function dealCard(deal) {
      const listing = api.listing(deal.listingId);
      const me = api.currentUser();
      const counterpart = api.broker(deal.requesterId === me.id ? deal.ownerId : deal.requesterId);
      const mySplit = deal.requesterId === me.id ? deal.splitRequester : deal.splitOwner;
      const theirSplit = 100 - mySplit;
      return (
        '<div class="card bg-base-100 shadow-sm border border-base-200">' +
          '<div class="card-body">' +
            '<div class="flex items-center justify-between">' +
              '<h3 class="card-title text-base">' + listing.title + '</h3>' +
              statusBadge(deal.status) +
            '</div>' +
            '<p class="text-sm text-base-content/70">Với: ' + counterpart.name + ' · HH ' + mySplit + '/' + theirSplit + '</p>' +
            '<p class="text-xs text-base-content/50">' + deal.createdAt + '</p>' +
            '<div class="card-actions justify-end mt-2">' +
              '<a href="deal-detail.html?id=' + deal.id + '" class="btn btn-outline btn-sm">Xem chi tiết</a>' +
            '</div>' +
          '</div>' +
        '</div>'
      );
    }

    function renderDeals(status) {
      const deals = api.deals(status ? { status } : undefined);
      const list = document.getElementById('deal-list');
      const empty = document.getElementById('empty-state');
      if (!deals.length) {
        list.innerHTML = '';
        list.classList.add('hidden');
        empty.classList.remove('hidden');
        empty.classList.add('flex');
      } else {
        list.classList.remove('hidden');
        empty.classList.add('hidden');
        empty.classList.remove('flex');
        list.innerHTML = deals.map(dealCard).join('');
      }
    }

    document.querySelectorAll('#status-tabs .tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('#status-tabs .tab').forEach(t => t.classList.remove('tab-active'));
        tab.classList.add('tab-active');
        renderDeals(tab.dataset.status);
      });
    });

    renderDeals('');
  </script>
</body>
</html>
