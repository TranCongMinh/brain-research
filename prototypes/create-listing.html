<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng tin mới — BrokerConnect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet" type="text/css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body class="bg-base-100 text-base-content">

  <div class="drawer lg:drawer-open">
    <input id="app-drawer" type="checkbox" class="drawer-toggle" />
    <div class="drawer-content flex flex-col min-h-screen">

      <div class="navbar bg-base-100 border-b border-base-200 px-4 lg:px-6 gap-2">
        <div class="flex-none lg:hidden">
          <label for="app-drawer" class="btn btn-square btn-ghost btn-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7" /></svg>
          </label>
        </div>
        <div class="flex-1">
          <a href="feed.html" class="btn btn-ghost btn-sm">← Quay lại bảng tin</a>
        </div>
      </div>

      <main class="flex-1 p-4 lg:p-6 bg-base-200/30">
        <div class="max-w-2xl mx-auto">
          <h1 class="text-2xl font-bold mb-6">Đăng tin mới</h1>

          <div class="form-control mb-4">
            <label class="label"><span class="label-text">Loại tin</span></label>
            <div class="flex gap-4">
              <label class="label cursor-pointer gap-2">
                <input type="radio" name="type" value="thue" class="radio radio-primary" checked onchange="toggleType()" />
                <span class="label-text">🏠 Nhà thuê</span>
              </label>
              <label class="label cursor-pointer gap-2">
                <input type="radio" name="type" value="xe" class="radio radio-primary" onchange="toggleType()" />
                <span class="label-text">🚗 Xe</span>
              </label>
            </div>
          </div>

          <div class="form-control mb-4">
            <label class="label"><span class="label-text">Tiêu đề tin</span></label>
            <input id="f-title" type="text" placeholder="VD: Chung cư 2PN Cầu Giấy" class="input input-bordered" />
          </div>

          <div id="fields-thue" class="grid grid-cols-2 gap-4 mb-4">
            <div class="form-control">
              <label class="label"><span class="label-text">Giá thuê / tháng (đ)</span></label>
              <input id="f-price-thue" type="number" placeholder="8000000" class="input input-bordered" />
            </div>
            <div class="form-control">
              <label class="label"><span class="label-text">Diện tích (m²)</span></label>
              <input id="f-area" type="number" placeholder="65" class="input input-bordered" />
            </div>
            <div class="form-control">
              <label class="label"><span class="label-text">Số phòng</span></label>
              <input id="f-rooms" type="number" placeholder="2" class="input input-bordered" />
            </div>
          </div>

          <div id="fields-xe" class="grid grid-cols-2 gap-4 mb-4 hidden">
            <div class="form-control">
              <label class="label"><span class="label-text">Giá thuê / ngày (đ)</span></label>
              <input id="f-price-xe" type="number" placeholder="600000" class="input input-bordered" />
            </div>
            <div class="form-control">
              <label class="label"><span class="label-text">Biển số</span></label>
              <input id="f-plate" type="text" placeholder="51K-123.45" class="input input-bordered" />
            </div>
          </div>

          <div class="form-control mb-4">
            <label class="label"><span class="label-text">Mô tả chi tiết</span></label>
            <textarea id="f-desc" class="textarea textarea-bordered" rows="3" placeholder="Mô tả tình trạng, vị trí, điều kiện..."></textarea>
          </div>

          <div class="form-control mb-4">
            <label class="label"><span class="label-text">Hình ảnh</span></label>
            <div class="flex gap-2">
              <div class="border-2 border-dashed border-base-300 rounded-box w-20 h-20 flex items-center justify-center text-2xl cursor-pointer hover:border-primary">+</div>
              <div class="border-2 border-dashed border-base-300 rounded-box w-20 h-20 flex items-center justify-center text-2xl cursor-pointer hover:border-primary">+</div>
              <div class="border-2 border-dashed border-base-300 rounded-box w-20 h-20 flex items-center justify-center text-2xl cursor-pointer hover:border-primary">+</div>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="form-control">
              <label class="label"><span class="label-text">% Hoa hồng đề nghị chia</span></label>
              <input id="f-commission" type="number" placeholder="50" class="input input-bordered" />
            </div>
            <div class="form-control">
              <label class="label"><span class="label-text">Nhóm hiển thị</span></label>
              <select id="f-group" class="select select-bordered"></select>
            </div>
          </div>

          <div class="flex gap-3">
            <a href="feed.html" class="btn btn-ghost flex-1">Hủy</a>
            <button class="btn btn-primary flex-1" onclick="submitListing()">Đăng tin</button>
          </div>
        </div>
      </main>
    </div>

    <div class="drawer-side z-20">
      <label for="app-drawer" class="drawer-overlay"></label>
      <aside class="w-64 min-h-screen bg-base-100 border-r border-base-200 p-4 flex flex-col">
        <a href="feed.html" class="text-xl font-bold px-2 mb-8 text-primary">🤝 BrokerConnect</a>
        <ul class="menu flex-1 gap-1">
          <li><a href="feed.html">📋 Bảng tin</a></li>
          <li><a href="my-deals.html">🤝 Deal của tôi</a></li>
          <li><a href="profile.html">👤 Hồ sơ</a></li>
        </ul>
        <div class="divider text-xs">Nhóm của tôi</div>
        <ul class="menu" id="my-groups-menu"></ul>
        <div class="mt-auto pt-4">
          <a href="#" id="reset-demo-data" class="text-xs text-base-content/40 hover:text-base-content/70">↺ Reset dữ liệu demo</a>
        </div>
      </aside>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script>
    function toggleType() {
      const type = document.querySelector('input[name="type"]:checked').value;
      document.getElementById('fields-thue').classList.toggle('hidden', type !== 'thue');
      document.getElementById('fields-xe').classList.toggle('hidden', type !== 'xe');
      populateGroupOptions(type);
    }

    function populateGroupOptions(type) {
      const sel = document.getElementById('f-group');
      sel.innerHTML = api.myGroups().filter(g => g.category === type)
        .map(g => '<option value="' + g.id + '">' + g.name + '</option>').join('');
    }

    function submitListing() {
      const type = document.querySelector('input[name="type"]:checked').value;
      const title = document.getElementById('f-title').value.trim();
      const commission = Number(document.getElementById('f-commission').value) || 0;
      const groupId = document.getElementById('f-group').value;
      const desc = document.getElementById('f-desc').value.trim();

      if (!title || !groupId) { showToast('Vui lòng nhập tiêu đề và chọn nhóm', 'warning'); return; }

      const base = { type, title, groupId, commissionPct: commission, desc: desc || '(chưa có mô tả)' };
      if (type === 'thue') {
        Object.assign(base, {
          price: Number(document.getElementById('f-price-thue').value) || 0,
          priceUnit: 'tháng',
          area: Number(document.getElementById('f-area').value) || 0,
          rooms: Number(document.getElementById('f-rooms').value) || 0
        });
      } else {
        Object.assign(base, {
          price: Number(document.getElementById('f-price-xe').value) || 0,
          priceUnit: 'ngày',
          plate: document.getElementById('f-plate').value.trim()
        });
      }
      const listing = api.addListing(base);
      showToast('Đã đăng tin "' + listing.title + '"');
      setTimeout(() => { window.location.href = 'feed.html?group=' + listing.groupId; }, 800);
    }

    populateGroupOptions('thue');
  </script>
</body>
</html>
