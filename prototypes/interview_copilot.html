<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Application Engineer (Junior & Mid) Interview Copilot</title>
  <style>
    :root {
      --bg-base: #0a0e17;
      --bg-surface: #111827;
      --bg-card: #182234;
      --bg-card-hover: #1e293b;
      --border-subtle: #27354a;
      --border-focus: #3b82f6;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-faint: #64748b;
      --accent-blue: #38bdf8;
      --accent-green: #34d399;
      --accent-red: #fb7185;
      --accent-purple: #c084fc;
      --accent-amber: #fbbf24;
      --pill-junior: #065f46;
      --pill-junior-text: #6ee7b7;
      --pill-mid: #1e40af;
      --pill-mid-text: #93c5fd;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 80px;
    }

    /* Top Sticky Control Header */
    header.copilot-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(17, 24, 39, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 12px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-title h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .brand-title span.badge {
      background: linear-gradient(135deg, #059669, #2563eb);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Timer Controls */
    .timer-container {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #0d131f;
      padding: 6px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
    }

    .timer-display {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--accent-amber);
      min-width: 65px;
      text-align: center;
    }

    .timer-btn {
      background: #1f293d;
      border: 1px solid #374151;
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .timer-btn:hover {
      background: #374151;
      border-color: #4b5563;
    }

    .timer-btn.active-preset {
      background: #2563eb;
      border-color: #3b82f6;
      color: #fff;
    }

    /* Header Actions */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .lang-switcher {
      display: flex;
      background: #0d131f;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 2px;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .lang-btn.active {
      background: #2563eb;
      color: #fff;
    }

    .export-btn {
      background: #059669;
      color: #fff;
      border: none;
      padding: 7px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .export-btn:hover {
      background: #10b981;
    }

    /* Stage Timeline Bar */
    .timeline-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .stage-item {
      background: #0f172a;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 6px 8px;
      text-align: center;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .stage-item .stage-time {
      font-size: 0.65rem;
      color: var(--text-faint);
      display: block;
      font-family: monospace;
    }

    .stage-item .stage-name {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .stage-item.active {
      background: #1e3a8a;
      border-color: #3b82f6;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.3);
    }

    .stage-item.active .stage-name {
      color: #fff;
    }

    .stage-item.active .stage-time {
      color: #93c5fd;
    }

    /* Filter & Search Toolbar */
    .toolbar-container {
      max-width: 1280px;
      margin: 18px auto 0;
      padding: 0 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 1;
      min-width: 280px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: #111827;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 10px 14px 10px 38px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--border-focus);
    }

    .search-box svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-faint);
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-chip {
      background: #111827;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 6px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }

    .filter-chip:hover {
      border-color: #4b5563;
      color: #fff;
    }

    .filter-chip.active {
      background: #2563eb;
      border-color: #3b82f6;
      color: #fff;
    }

    .filter-chip.pinned-chip.active {
      background: #d97706;
      border-color: #f59e0b;
    }

    /* Question Cards List */
    main.content-area {
      max-width: 1280px;
      margin: 20px auto;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .question-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s, border-color 0.2s;
    }

    .question-card:hover {
      border-color: #334155;
    }

    .card-meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .meta-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge-id {
      background: #0f172a;
      border: 1px solid #334155;
      font-family: monospace;
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--accent-blue);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .badge-level {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge-junior { background: var(--pill-junior); color: var(--pill-junior-text); }
    .badge-mid { background: var(--pill-mid); color: var(--pill-mid-text); }

    .badge-time {
      color: var(--text-faint);
      font-size: 0.75rem;
      font-family: monospace;
    }

    .btn-pin {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.75rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .btn-pin:hover, .btn-pin.pinned {
      background: #d97706;
      border-color: #f59e0b;
      color: #fff;
    }

    /* Dual Language Section Layout */
    .dual-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
      margin-bottom: 18px;
    }

    .layout-dual .dual-container {
      grid-template-columns: 1fr 1fr;
    }

    @media (max-width: 1024px) {
      .layout-dual .dual-container {
        grid-template-columns: 1fr;
      }
    }

    .lang-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .col-header {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-faint);
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Spoken Natural Question Quote */
    .spoken-question-box {
      background: #0f172a;
      border-left: 4px solid var(--accent-blue);
      border-radius: 4px 8px 8px 4px;
      padding: 14px 16px;
      margin-bottom: 4px;
    }

    .spoken-question-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent-blue);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .spoken-question-text {
      font-size: 1.02rem;
      font-weight: 500;
      color: #fff;
      font-style: italic;
      line-height: 1.5;
    }

    /* Content Blocks: Technical Core, Signals, Red Flags, Probes */
    .content-block {
      background: #111827;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 14px;
      font-size: 0.88rem;
    }

    .content-block-header {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .core-box {
      border-left: 4px solid var(--accent-amber);
    }
    .core-box .content-block-header { color: var(--accent-amber); }

    .signal-box {
      border-left: 4px solid var(--accent-green);
    }
    .signal-box .content-block-header { color: var(--accent-green); }

    .flag-box {
      border-left: 4px solid var(--accent-red);
    }
    .flag-box .content-block-header { color: var(--accent-red); }

    .probe-box {
      border-left: 4px solid var(--accent-purple);
    }
    .probe-box .content-block-header { color: var(--accent-purple); }

    .content-block ul {
      padding-left: 20px;
      margin-top: 6px;
    }

    .content-block li {
      margin-bottom: 6px;
      color: #d1d5db;
    }

    .content-block li strong {
      color: #f3f4f6;
    }

    /* Card Interactive Evaluation Footer */
    .card-eval-footer {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px dashed var(--border-subtle);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: #0f172a;
      padding: 12px 16px;
      border-radius: 8px;
    }

    .rating-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .rating-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .stars-container {
      display: flex;
      gap: 4px;
    }

    .star-btn {
      background: none;
      border: none;
      color: #4b5563;
      font-size: 1.15rem;
      cursor: pointer;
      transition: color 0.15s, transform 0.1s;
      padding: 0 2px;
    }

    .star-btn:hover {
      transform: scale(1.2);
    }

    .star-btn.rated {
      color: #f59e0b;
    }

    .note-input-container {
      flex: 1;
      min-width: 250px;
    }

    .note-input {
      width: 100%;
      background: #182234;
      border: 1px solid var(--border-subtle);
      color: #fff;
      font-size: 0.82rem;
      padding: 6px 10px;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s;
    }

    .note-input:focus {
      border-color: var(--border-focus);
    }

    /* Toast Notification */
    #toast-msg {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #10b981;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.88rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      display: none;
      align-items: center;
      gap: 8px;
      z-index: 1000;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state h3 {
      font-size: 1.2rem;
      color: #fff;
      margin-bottom: 8px;
    }
  </style>
</head>
<body class="layout-dual">

  <!-- Top Sticky Header -->
  <header class="copilot-header">
    <div class="header-top">
      <div class="brand-title">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <h1>AI App Engineer Copilot</h1>
        <span class="badge">Junior & Mid</span>
      </div>

      <!-- Live Timer -->
      <div class="timer-container">
        <span class="timer-display" id="timer-display">00:00</span>
        <button class="timer-btn" id="btn-timer-toggle" title="Bắt đầu / Tạm dừng">
          <span id="timer-icon">▶</span> <span id="timer-status-text">Start</span>
        </button>
        <button class="timer-btn" id="btn-timer-reset" title="Đặt lại về 0">↺</button>
        <div style="height: 18px; width: 1px; background: #374151; margin: 0 4px;"></div>
        <button class="timer-btn active-preset" id="btn-preset-45" data-preset="45">45m</button>
        <button class="timer-btn" id="btn-preset-60" data-preset="60">60m</button>
      </div>

      <!-- Language & Export -->
      <div class="header-actions">
        <div class="lang-switcher">
          <button class="lang-btn" data-lang="vi">Tiếng Việt</button>
          <button class="lang-btn" data-lang="en">English</button>
          <button class="lang-btn active" data-lang="dual">Dual Split</button>
        </div>
        <button class="export-btn" id="btn-export-copy" title="Copy báo cáo Markdown">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          Copy Report
        </button>
        <button class="export-btn" id="btn-export-download" style="background:#2563eb;" title="Tải file Markdown">
          ↓ .md
        </button>
      </div>
    </div>

    <!-- 5 Stages Timeline Progress -->
    <div class="timeline-bar" id="timeline-bar">
      <div class="stage-item active" data-stage="1">
        <span class="stage-time" id="stage-time-1">00–08m</span>
        <span class="stage-name">1. LLM & Tokens</span>
      </div>
      <div class="stage-item" data-stage="2">
        <span class="stage-time" id="stage-time-2">08–20m</span>
        <span class="stage-name">2. RAG & Vectors</span>
      </div>
      <div class="stage-item" data-stage="3">
        <span class="stage-time" id="stage-time-3">20–30m</span>
        <span class="stage-name">3. Agents & Tools</span>
      </div>
      <div class="stage-item" data-stage="4">
        <span class="stage-time" id="stage-time-4">30–38m</span>
        <span class="stage-name">4. Prod & Practical</span>
      </div>
      <div class="stage-item" data-stage="5">
        <span class="stage-time" id="stage-time-5">38–45m</span>
        <span class="stage-name">5. Evals & Safety</span>
      </div>
    </div>
  </header>

  <!-- Filter & Search Toolbar -->
  <div class="toolbar-container">
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="search-input" placeholder="Tìm theo khái niệm (vd: Token, Temperature, Embedding, RAG, Chunking, Function Calling, Memory, Streaming, Ảo giác)...">
    </div>

    <div class="filter-group">
      <span style="font-size:0.75rem; color:var(--text-faint); margin-right:4px;">CHẶNG:</span>
      <span class="filter-chip active" data-filter-type="stage" data-filter-val="all">All</span>
      <span class="filter-chip" data-filter-type="stage" data-filter-val="1">P1</span>
      <span class="filter-chip" data-filter-type="stage" data-filter-val="2">P2</span>
      <span class="filter-chip" data-filter-type="stage" data-filter-val="3">P3</span>
      <span class="filter-chip" data-filter-type="stage" data-filter-val="4">P4</span>
      <span class="filter-chip" data-filter-type="stage" data-filter-val="5">P5</span>

      <span style="font-size:0.75rem; color:var(--text-faint); margin:0 4px 0 10px;">LEVEL:</span>
      <span class="filter-chip active" data-filter-type="level" data-filter-val="all">All</span>
      <span class="filter-chip" data-filter-type="level" data-filter-val="Junior">Junior (7)</span>
      <span class="filter-chip" data-filter-type="level" data-filter-val="Mid">Mid (7)</span>

      <span class="filter-chip pinned-chip" id="filter-pinned-btn" style="margin-left: 10px;">📌 Ghim (0)</span>
    </div>
  </div>

  <!-- Main Question Cards Container -->
  <main class="content-area" id="cards-container">
    <!-- Rendered dynamically by JS -->
  </main>

  <!-- Toast Notification -->
  <div id="toast-msg">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <span id="toast-text">Báo cáo đã được copy vào clipboard!</span>
  </div>

  <script>
    /* ==========================================================================
       DATASET: 14 JUNIOR & MID CONCEPTUAL QUESTIONS (P1-Q1 to P5-Q2)
       ========================================================================== */
    const QUESTIONS_DATA = [
      // PILLAR 1: LLM Fundamentals & Prompting
      {
        id: "P1-Q1",
        pillar: 1,
        level: "Junior",
        timeGuide: "3-4m",
        title_vi: "Khái Niệm Token, Tokenizer & Chi Phí Tiếng Việt",
        title_en: "Tokens, Tokenization & Language Cost Overhead",
        question_vi: "Token là gì và khác gì so với từ hay ký tự thông thường? Khi gửi một đoạn văn bản tiếng Việt dài 100 từ vào OpenAI, tại sao hóa đơn lại đếm lên tới 200–300 tokens trong khi tiếng Anh cùng độ dài chỉ mất khoảng 120 tokens? Điều này ảnh hưởng gì đến chi phí và context window?",
        question_en: "What is a token, and how does it differ from a regular word or character? When submitting a 100-word Vietnamese text to OpenAI, why does it register 200–300 tokens whereas an English text of identical length uses around 120 tokens? How does this impact API cost and context window limits?",
        core_vi: "Bản chất Tokenizer & Byte-Pair Encoding (BPE): LLM đọc dữ liệu dưới dạng Token IDs. Tiếng Anh có từ vựng phong phú trong tập pretraining nên 1 từ thường là 1 token. Tiếng Việt có dấu thanh bị xé nhỏ thành nhiều sub-words hoặc từng byte riêng lẻ, dẫn tới tiêu tốn gấp 2-3 lần tokens cho cùng một nội dung.",
        core_en: "Tokenizer & Byte-Pair Encoding (BPE) mechanics: LLMs process numerical Token IDs, not characters. English words frequently map to single tokens due to pretraining corpus dominance. Accented languages like Vietnamese are fractured into multiple sub-words/bytes, inflating token consumption 2-3x for identical semantic length.",
        signals_vi: [
          "Giải thích được khái niệm Sub-word Tokenization và thuật toán BPE.",
          "Nắm được quy tắc ngón tay cái: 1 token ≈ 0.75 từ tiếng Anh, nhưng chỉ bằng 0.3-0.5 từ tiếng Việt.",

        ],
        probe_vi: "Indirect Prompt Injection là gì? Nó nguy hiểm như thế nào nếu con bot của bạn có tính năng đọc và tóm tắt nội dung của một trang web ngẫu nhiên do người dùng cung cấp link?",
        probe_en: "What is Indirect Prompt Injection, and how does it manifest when a bot fetches and summarizes content from arbitrary external websites?"
      }
    ];

    /* ==========================================================================
       APPLICATION STATE & LOCAL STORAGE PERSISTENCE
       ========================================================================== */
    const STORAGE_KEY = "ai_interview_copilot_state_v2";

    let appState = {
      lang: "dual", // "vi", "en", "dual"
      stageFilter: "all",
      levelFilter: "all",
      searchQuery: "",
      onlyPinned: false,
      pinnedIds: [],
      ratings: {},
      notes: {},
      timerSeconds: 0,
      timerRunning: false,
      timerPreset: 45 // 45 or 60 default
    };

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          appState = { ...appState, ...parsed };
          appState.timerRunning = false;
        }
      } catch (e) {
        console.warn("LocalStorage unavailable, using in-memory state:", e);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        console.warn("Failed to persist state to LocalStorage:", e);
      }
    }

    /* ==========================================================================
       WEB AUDIO API SYNTHETIC CHIME (Zero-dependency stage notification)
       ========================================================================== */
    let audioCtx = null;

    function playStageChime() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(587.33, now); // D5
        osc.frequency.exponentialRampToValueAtTime(880.00, now + 0.15); // A5

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.5);
      } catch (e) {
        console.log("Audio chime skipped:", e);
      }
    }

    /* ==========================================================================
       TIMER & PACING ENGINE
       ========================================================================== */
    let timerInterval = null;
    let lastActiveStage = 1;

    const PRESETS = {
      45: [
        { stage: 1, end: 8 * 60 },
        { stage: 2, end: 20 * 60 },
        { stage: 3, end: 30 * 60 },
        { stage: 4, end: 38 * 60 },
        { stage: 5, end: 45 * 60 }
      ],
      60: [
        { stage: 1, end: 10 * 60 },
        { stage: 2, end: 25 * 60 },
        { stage: 3, end: 40 * 60 },
        { stage: 4, end: 50 * 60 },
        { stage: 5, end: 60 * 60 }
      ]
    };

    function formatTime(totalSeconds) {
      const m = Math.floor(totalSeconds / 60);
      const s = totalSeconds % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function updateTimerUI() {
      document.getElementById("timer-display").textContent = formatTime(appState.timerSeconds);
      updateActiveStage();
    }

    function updateActiveStage() {
      const presetPlan = PRESETS[appState.timerPreset] || PRESETS[45];
      let currentStage = 1;

      for (let i = 0; i < presetPlan.length; i++) {
        if (appState.timerSeconds < presetPlan[i].end) {
          currentStage = presetPlan[i].stage;
          break;
        }
        if (i === presetPlan.length - 1) {
          currentStage = 5;
        }
      }

      if (currentStage !== lastActiveStage && appState.timerRunning) {
        playStageChime();
        lastActiveStage = currentStage;
      }

      document.querySelectorAll(".stage-item").forEach(item => {
        const stageNum = parseInt(item.getAttribute("data-stage"));
        if (stageNum === currentStage) {
          item.classList.add("active");
        } else {
          item.classList.remove("active");
        }
      });
    }

    function toggleTimer() {
      if (!audioCtx) {
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {}
      }

      if (appState.timerRunning) {
        clearInterval(timerInterval);
        appState.timerRunning = false;
        document.getElementById("timer-icon").textContent = "▶";
        document.getElementById("timer-status-text").textContent = "Start";
        document.getElementById("btn-timer-toggle").style.background = "#1f293d";
      } else {
        appState.timerRunning = true;
        document.getElementById("timer-icon").textContent = "⏸";
        document.getElementById("timer-status-text").textContent = "Pause";
        document.getElementById("btn-timer-toggle").style.background = "#d97706";
        timerInterval = setInterval(() => {
          appState.timerSeconds++;
          updateTimerUI();
          if (appState.timerSeconds % 5 === 0) saveState();
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      appState.timerRunning = false;
      appState.timerSeconds = 0;
      lastActiveStage = 1;
      document.getElementById("timer-icon").textContent = "▶";
      document.getElementById("timer-status-text").textContent = "Start";
      document.getElementById("btn-timer-toggle").style.background = "#1f293d";
      updateTimerUI();
      saveState();
    }

    function setPreset(presetMinutes) {
      appState.timerPreset = presetMinutes;
      document.getElementById("btn-preset-45").classList.toggle("active-preset", presetMinutes === 45);
      document.getElementById("btn-preset-60").classList.toggle("active-preset", presetMinutes === 60);

      if (presetMinutes === 45) {
        document.getElementById("stage-time-1").textContent = "00–08m";
        document.getElementById("stage-time-2").textContent = "08–20m";
        document.getElementById("stage-time-3").textContent = "20–30m";
        document.getElementById("stage-time-4").textContent = "30–38m";
        document.getElementById("stage-time-5").textContent = "38–45m";
      } else {
        document.getElementById("stage-time-1").textContent = "00–10m";
        document.getElementById("stage-time-2").textContent = "10–25m";
        document.getElementById("stage-time-3").textContent = "25–40m";
        document.getElementById("stage-time-4").textContent = "40–50m";
        document.getElementById("stage-time-5").textContent = "50–60m";
      }
      updateActiveStage();
      saveState();
    }

    /* ==========================================================================
       RENDER CARDS ENGINE (DIRECT FULL-CONTENT DISPLAY)
       ========================================================================== */
    function renderCards() {
      const container = document.getElementById("cards-container");
      const q = appState.searchQuery.trim().toLowerCase();

      const filtered = QUESTIONS_DATA.filter(item => {
        if (appState.stageFilter !== "all" && item.pillar !== parseInt(appState.stageFilter)) {
          return false;
        }
        if (appState.levelFilter !== "all" && item.level !== appState.levelFilter) {
          return false;
        }
        if (appState.onlyPinned && !appState.pinnedIds.includes(item.id)) {
          return false;
        }
        if (q) {
          const matchId = item.id.toLowerCase().includes(q);
          const matchTitleVi = item.title_vi.toLowerCase().includes(q);
          const matchTitleEn = item.title_en.toLowerCase().includes(q);
          const matchQVi = item.question_vi.toLowerCase().includes(q);
          const matchQEn = item.question_en.toLowerCase().includes(q);
          const matchCoreVi = item.core_vi.toLowerCase().includes(q);
          const matchCoreEn = item.core_en.toLowerCase().includes(q);
          const matchSignals = item.signals_vi.concat(item.signals_en).some(s => s.toLowerCase().includes(q));
          const matchFlags = item.flags_vi.concat(item.flags_en).some(f => f.toLowerCase().includes(q));

          return matchId || matchTitleVi || matchTitleEn || matchQVi || matchQEn || matchCoreVi || matchCoreEn || matchSignals || matchFlags;
        }
        return true;
      });

      document.getElementById("filter-pinned-btn").textContent = `📌 Ghim (${appState.pinnedIds.length})`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>Không tìm thấy câu hỏi phù hợp</h3>
            <p>Hãy thử thay đổi từ khóa tìm kiếm hoặc bỏ bớt các bộ lọc.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const isPinned = appState.pinnedIds.includes(item.id);
        const currentRating = appState.ratings[item.id] || 0;
        const currentNote = appState.notes[item.id] || "";
        const levelBadgeClass = `badge-${item.level.toLowerCase()}`;

        const showVi = appState.lang === "vi" || appState.lang === "dual";
        const showEn = appState.lang === "en" || appState.lang === "dual";

        return `
          <article class="question-card" id="card-${item.id}">
            <!-- Card Header Meta -->
            <div class="card-meta-bar">
              <div class="meta-left">
                <span class="badge-id">${item.id}</span>
                <span class="badge-level ${levelBadgeClass}">${item.level}</span>
                <span class="badge-time">⏱ ${item.timeGuide}</span>
                <span style="font-size:0.85rem; font-weight:700; color:#cbd5e1; margin-left:4px;">
                  ${appState.lang === 'en' ? item.title_en : item.title_vi}
                </span>
              </div>
              <button class="btn-pin ${isPinned ? 'pinned' : ''}" onclick="togglePin('${item.id}')">
                📌 <span>${isPinned ? 'Đã ghim' : 'Ghim câu này'}</span>
              </button>
            </div>

            <!-- Direct Full-Content Dual Container -->
            <div class="dual-container">
              ${showVi ? `
                <div class="lang-column">
                  ${appState.lang === 'dual' ? '<div class="col-header">🇻🇳 TIẾNG VIỆT</div>' : ''}
                  
                  <!-- Spoken Question -->
                  <div class="spoken-question-box">
                    <div class="spoken-question-label">
                      🗣️ Cách hỏi tự nhiên (Thực tế phỏng vấn)
                    </div>
                    <div class="spoken-question-text">
                      "${item.question_vi}"
                    </div>
                  </div>

                  <!-- Technical Core -->
                  <div class="content-block core-box">
                    <div class="content-block-header">
                      💡 Khái niệm & Bản chất kỹ thuật
                    </div>
                    <div>${item.core_vi}</div>
                  </div>

                  <!-- Strong Signals -->
                  <div class="content-block signal-box">
                    <div class="content-block-header">
                      🟢 Strong Signals (Ứng viên hiểu bản chất)
                    </div>
                    <ul>
                      ${item.signals_vi.map(s => `<li>${s}</li>`).join('')}
                    </ul>
                  </div>

                  <!-- Red Flags -->
                  <div class="content-block flag-box">
                    <div class="content-block-header">
                      🔴 Red Flags (Học vẹt / Chém gió)
                    </div>
                    <ul>
                      ${item.flags_vi.map(f => `<li>${f}</li>`).join('')}
                    </ul>
                  </div>

                  <!-- Drill-down Probes -->
                  <div class="content-block probe-box">
                    <div class="content-block-header">
                      🔬 Drill-down Probes (Hỏi vặn bóc tách)
                    </div>
                    <div><strong>Hỏi vặn:</strong> "${item.probe_vi}"</div>
                  </div>
                </div>
              ` : ''}

              ${showEn ? `
                <div class="lang-column">
                  ${appState.lang === 'dual' ? '<div class="col-header">🇺🇸 ENGLISH</div>' : ''}
                  
                  <!-- Spoken Question -->
                  <div class="spoken-question-box">
                    <div class="spoken-question-label">
                      🗣️ Natural Spoken Framing
                    </div>
                    <div class="spoken-question-text">
                      "${item.question_en}"
                    </div>
                  </div>

                  <!-- Technical Core -->
                  <div class="content-block core-box">
                    <div class="content-block-header">
                      💡 Core Concept & Fundamentals
                    </div>
                    <div>${item.core_en}</div>
                  </div>

                  <!-- Strong Signals -->
                  <div class="content-block signal-box">
                    <div class="content-block-header">
                      🟢 Strong Signals (Solid Knowledge)
                    </div>
                    <ul>
                      ${item.signals_en.map(s => `<li>${s}</li>`).join('')}
                    </ul>
                  </div>

                  <!-- Red Flags -->
                  <div class="content-block flag-box">
                    <div class="content-block-header">
                      🔴 Red Flags (Superficial / AI Cliches)
                    </div>
                    <ul>
                      ${item.flags_en.map(f => `<li>${f}</li>`).join('')}
                    </ul>
                  </div>

                  <!-- Drill-down Probes -->
                  <div class="content-block probe-box">
                    <div class="content-block-header">
                      🔬 Drill-down Probes (Reality Check)
                    </div>
                    <div><strong>Deep probe:</strong> "${item.probe_en}"</div>
                  </div>
                </div>
              ` : ''}
            </div>

            <!-- Inline Scorecard Footer -->
            <div class="card-eval-footer">
              <div class="rating-group">
                <span class="rating-label">Đánh giá ứng viên:</span>
                <div class="stars-container">
                  ${[1, 2, 3, 4, 5].map(star => `
                    <button class="star-btn ${star <= currentRating ? 'rated' : ''}" 
                            onclick="setRating('${item.id}', ${star})" 
                            title="${star} sao">★</button>
                  `).join('')}
                </div>
              </div>
              <div class="note-input-container">
                <input type="text" class="note-input" 
                       placeholder="Ghi chú nhanh câu này (vd: Nắm chắc BPE, giải thích hay)..." 
                       value="${escapeHtml(currentNote)}" 
                       onchange="saveNote('${item.id}', this.value)" />
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function escapeHtml(text) {
      return text.replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    /* ==========================================================================
       USER ACTIONS & HANDLERS
       ========================================================================== */
    function togglePin(id) {
      if (appState.pinnedIds.includes(id)) {
        appState.pinnedIds = appState.pinnedIds.filter(x => x !== id);
      } else {
        appState.pinnedIds.push(id);
      }
      saveState();
      renderCards();
    }

    function setRating(id, stars) {
      if (appState.ratings[id] === stars) {
        delete appState.ratings[id];
      } else {
        appState.ratings[id] = stars;
      }
      saveState();
      renderCards();
    }

    function saveNote(id, text) {
      if (text.trim() === "") {
        delete appState.notes[id];
      } else {
        appState.notes[id] = text.trim();
      }
      saveState();
    }

    function showToast(text) {
      const toast = document.getElementById("toast-msg");
      document.getElementById("toast-text").textContent = text;
      toast.style.display = "flex";
      setTimeout(() => {
        toast.style.display = "none";
      }, 3000);
    }

    /* ==========================================================================
       MARKDOWN REPORT GENERATOR
       ========================================================================== */
    function generateMarkdownReport() {
      const now = new Date();
      const dateStr = now.toLocaleDateString("vi-VN") + " " + now.toLocaleTimeString("vi-VN");
      const elapsed = formatTime(appState.timerSeconds);
      const ratedCount = Object.keys(appState.ratings).length;

      let md = `# Báo Cáo Phỏng Vấn: AI Application Engineer (Junior/Mid)\n\n`;
      md += `- **Thời gian thực hiện:** ${dateStr}\n`;
      md += `- **Lịch trình:** ${appState.timerPreset} phút | **Thời gian đã dùng:** ${elapsed}\n`;
      md += `- **Số câu đã đánh giá:** ${ratedCount} / ${QUESTIONS_DATA.length}\n\n`;
      md += `---\n\n## Chi Tiết Đánh Giá Từng Câu Hỏi\n\n`;

      QUESTIONS_DATA.forEach(q => {
        const rating = appState.ratings[q.id];
        const note = appState.notes[q.id];
        const isPinned = appState.pinnedIds.includes(q.id);

        if (rating || note || isPinned) {
          md += `### [${q.id}] ${q.title_vi} (${q.level})\n`;
          if (rating) md += `- **Điểm đánh giá:** ${"★".repeat(rating)}${"☆".repeat(5 - rating)} (${rating}/5)\n`;
          if (note) md += `- **Ghi chú nhận xét:** ${note}\n`;
          md += `- **Câu hỏi phỏng vấn:** *"${q.question_vi}"*\n\n`;
        }
      });

      md += `---\n*Xuất tự động từ AI Application Engineer Interview Copilot (Junior & Mid Edition).*`;
      return md;
    }

    function copyReportToClipboard() {
      const report = generateMarkdownReport();
      navigator.clipboard.writeText(report).then(() => {
        showToast("Đã copy báo cáo phỏng vấn (Markdown) vào clipboard!");
      }).catch(err => {
        console.error("Clipboard copy error:", err);
        showToast("Lỗi khi copy. Vui lòng thử lại.");
      });
    }

    function downloadReportMarkdown() {
      const report = generateMarkdownReport();
      const blob = new Blob([report], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const timestamp = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `interview-eval-junior-mid-${timestamp}.md`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("Đã tải xuống file interview-eval-junior-mid.md!");
    }

    /* ==========================================================================
       BOOTSTRAP & EVENT LISTENERS
       ========================================================================== */
    document.addEventListener("DOMContentLoaded", () => {
      loadState();

      setPreset(appState.timerPreset);
      updateTimerUI();

      // Language Buttons
      document.querySelectorAll(".lang-btn").forEach(btn => {
        if (btn.getAttribute("data-lang") === appState.lang) {
          btn.classList.add("active");
        } else {
          btn.classList.remove("active");
        }
        btn.addEventListener("click", () => {
          document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          appState.lang = btn.getAttribute("data-lang");
          document.body.className = appState.lang === "dual" ? "layout-dual" : "layout-single";
          saveState();
          renderCards();
        });
      });
      document.body.className = appState.lang === "dual" ? "layout-dual" : "layout-single";

      // Timer Buttons
      document.getElementById("btn-timer-toggle").addEventListener("click", toggleTimer);
      document.getElementById("btn-timer-reset").addEventListener("click", resetTimer);
      document.getElementById("btn-preset-45").addEventListener("click", () => setPreset(45));
      document.getElementById("btn-preset-60").addEventListener("click", () => setPreset(60));

      // Filter Chips: Stage
      document.querySelectorAll('[data-filter-type="stage"]').forEach(chip => {
        if (chip.getAttribute("data-filter-val") === appState.stageFilter) {
          chip.classList.add("active");
        } else {
          chip.classList.remove("active");
        }
        chip.addEventListener("click", () => {
          document.querySelectorAll('[data-filter-type="stage"]').forEach(c => c.classList.remove("active"));
          chip.classList.add("active");
          appState.stageFilter = chip.getAttribute("data-filter-val");
          renderCards();
        });
      });

      // Filter Chips: Level
      document.querySelectorAll('[data-filter-type="level"]').forEach(chip => {
        if (chip.getAttribute("data-filter-val") === appState.levelFilter) {
          chip.classList.add("active");
        } else {
          chip.classList.remove("active");
        }
        chip.addEventListener("click", () => {
          document.querySelectorAll('[data-filter-type="level"]').forEach(c => c.classList.remove("active"));
          chip.classList.add("active");
          appState.levelFilter = chip.getAttribute("data-filter-val");
          renderCards();
        });
      });

      // Pinned Filter Toggle
      const pinnedBtn = document.getElementById("filter-pinned-btn");
      pinnedBtn.addEventListener("click", () => {
        appState.onlyPinned = !appState.onlyPinned;
        pinnedBtn.classList.toggle("active", appState.onlyPinned);
        renderCards();
      });

      // Stage items click
      document.querySelectorAll(".stage-item").forEach(item => {
        item.addEventListener("click", () => {
          const stage = item.getAttribute("data-stage");
          appState.stageFilter = stage;
          document.querySelectorAll('[data-filter-type="stage"]').forEach(c => {
            c.classList.toggle("active", c.getAttribute("data-filter-val") === stage);
          });
          renderCards();
        });
      });

      // Search Input
      const searchInput = document.getElementById("search-input");
      searchInput.value = appState.searchQuery;
      searchInput.addEventListener("input", (e) => {
        appState.searchQuery = e.target.value;
        renderCards();
      });

      // Export Buttons
      document.getElementById("btn-export-copy").addEventListener("click", copyReportToClipboard);
      document.getElementById("btn-export-download").addEventListener("click", downloadReportMarkdown);

      renderCards();
    });
  </script>
</body>
</html>
